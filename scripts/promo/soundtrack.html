<!doctype html>
<meta charset="utf-8" />
<title>Corner Lands promo soundtrack</title>
<script>
  // The trailer's score, rendered offline: the game's own voices (recorder,
  // lute pluck, drone) with a tabor, in the game's seasonal modes, following
  // the trailer's scenes. render() returns a 16-bit stereo WAV as base64.
  const RATE = 44100;
  const hz = (m) => 440 * 2 ** ((m - 69) / 12);
  const MODES = {
    spring: { root: 62, steps: [0, 2, 3, 5, 7, 9, 10, 12, 14] },
    summer: { root: 67, steps: [0, 2, 4, 5, 7, 9, 10, 12, 14] },
    autumn: { root: 57, steps: [0, 2, 3, 5, 7, 8, 10, 12, 14] },
    winter: { root: 64, steps: [0, 2, 3, 5, 7, 8, 10, 12, 14] },
  };
  let seed = 11;
  const rand = () => ((seed = (seed * 1103515245 + 12345) & 0x7fffffff) / 0x7fffffff);

  function recorder(ac, out, f, t, d, vol = 0.32) {
    const o = ac.createOscillator();
    o.type = 'sine';
    o.frequency.value = f;
    const o2 = ac.createOscillator();
    o2.type = 'sine';
    o2.frequency.value = f * 2;
    const g2 = ac.createGain();
    g2.gain.value = 0.12;
    o2.connect(g2);
    const vib = ac.createOscillator();
    vib.frequency.value = 5;
    const va = ac.createGain();
    va.gain.value = f * 0.005;
    vib.connect(va).connect(o.frequency);
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(vol, t + 0.05);
    g.gain.setValueAtTime(vol, t + d * 0.75);
    g.gain.linearRampToValueAtTime(0, t + d * 0.98);
    o.connect(g);
    g2.connect(g);
    g.connect(out);
    for (const x of [o, o2, vib]) {
      x.start(t);
      x.stop(t + d);
    }
  }
  function pluck(ac, out, f, t, vol = 0.22, decay = 1.3) {
    for (const [mul, v] of [[1, 1], [2, 0.35], [3, 0.12]]) {
      const o = ac.createOscillator();
      o.type = 'triangle';
      o.frequency.value = f * mul;
      const g = ac.createGain();
      g.gain.setValueAtTime(vol * v, t);
      g.gain.exponentialRampToValueAtTime(0.0005, t + decay / mul);
      o.connect(g).connect(out);
      o.start(t);
      o.stop(t + decay);
    }
  }
  function drone(ac, out, f, t0, t1, vol = 0.05) {
    const lp = ac.createBiquadFilter();
    lp.type = 'lowpass';
    lp.frequency.value = 700;
    const g = ac.createGain();
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(vol, t0 + 0.8);
    g.gain.setValueAtTime(vol, t1 - 0.8);
    g.gain.linearRampToValueAtTime(0, t1);
    for (const [mul, det] of [[1, 0], [1.5, 3], [0.5, -2]]) {
      const o = ac.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = f * mul;
      o.detune.value = det;
      o.connect(lp);
      o.start(t0);
      o.stop(t1);
    }
    lp.connect(g).connect(out);
  }
  let noiseBuf = null;
  function tabor(ac, out, t, vol = 0.5, low = false) {
    if (!noiseBuf) {
      noiseBuf = ac.createBuffer(1, RATE * 0.3, RATE);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    }
    const n = ac.createBufferSource();
    n.buffer = noiseBuf;
    const bp = ac.createBiquadFilter();
    bp.type = 'bandpass';
    bp.frequency.value = low ? 220 : 900;
    bp.Q.value = 1.2;
    const g = ac.createGain();
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + (low ? 0.28 : 0.12));
    n.connect(bp).connect(g).connect(out);
    n.start(t);
    n.stop(t + 0.3);
    if (low) {
      const o = ac.createOscillator();
      o.frequency.setValueAtTime(110, t);
      o.frequency.exponentialRampToValueAtTime(55, t + 0.25);
      const og = ac.createGain();
      og.gain.setValueAtTime(vol * 0.8, t);
      og.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(og).connect(out);
      o.start(t);
      o.stop(t + 0.32);
    }
  }

  /** Sections of the trailer: [start, end, mode, energy 0-2]. */
  const SECTIONS = [
    [0, 4.5, 'spring', 0],
    [4.5, 19, 'spring', 2],
    [19, 28, 'summer', 2],
    [28, 30, 'spring', 1],
    [30, 32, 'summer', 1],
    [32, 34, 'autumn', 1],
    [34, 36, 'winter', 1],
    [36, 42, 'autumn', 0],
    [42, 56, 'summer', 2],
    [56, 62, 'summer', 0],
  ];
  const BEAT = 0.5; // 120 to the minute

  async function render() {
    const total = 62;
    const ac = new OfflineAudioContext(2, RATE * total, RATE);
    const master = ac.createGain();
    master.gain.value = 0.9;
    // A little room.
    const conv = ac.createConvolver();
    const ir = ac.createBuffer(2, RATE * 1.6, RATE);
    for (let c = 0; c < 2; c++) {
      const d = ir.getChannelData(c);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length) ** 3;
    }
    conv.buffer = ir;
    const wet = ac.createGain();
    wet.gain.value = 0.25;
    master.connect(ac.destination);
    master.connect(conv).connect(wet).connect(ac.destination);

    for (const [a, b, modeName, energy] of SECTIONS) {
      const m = MODES[modeName];
      drone(ac, master, hz(m.root - 24), a, b + 0.3, energy === 0 ? 0.035 : 0.045);
      // Lute: a broken chord on each beat.
      const arp = [0, 4, 7, 4];
      for (let t = a, k = 0; t < b - 0.05; t += BEAT / (energy === 2 ? 2 : 1), k++) {
        const deg = arp[k % arp.length];
        pluck(ac, master, hz(m.root - 12 + m.steps[Math.min(deg, m.steps.length - 1)]), t, energy === 0 ? 0.12 : 0.16);
      }
      // Tabor: a dance beat when the town is busy.
      if (energy === 2) {
        for (let t = a, k = 0; t < b - 0.05; t += BEAT / 2, k++) {
          if (k % 4 === 0) tabor(ac, master, t, 0.5, true);
          else if (k % 2 === 1) tabor(ac, master, t, 0.22);
          else if (rand() < 0.4) tabor(ac, master, t, 0.15);
        }
      } else if (energy === 1) {
        for (let t = a; t < b - 0.05; t += BEAT * 2) tabor(ac, master, t, 0.35, true);
      }
      // Recorder: phrases on the scale, ending on the root.
      let t = a + (energy === 0 ? 0.6 : 0);
      let deg = 4;
      while (t < b - 0.3) {
        const left = b - t;
        const long = rand() < 0.3;
        let d = (long ? 2 : 1) * BEAT * (energy === 0 ? 2 : 1);
        if (rand() < 0.25 && energy === 2) d = BEAT / 2;
        if (d > left) d = left;
        const last = left - d < 0.3;
        deg = last ? (rand() < 0.5 ? 0 : 7) : Math.max(0, Math.min(m.steps.length - 1, deg + [-2, -1, -1, 1, 1, 2, 0][Math.floor(rand() * 7)]));
        recorder(ac, master, hz(m.root + m.steps[deg]), t, d * 0.95, energy === 0 ? 0.24 : 0.3);
        t += d;
      }
    }
    // The last chord, held.
    const fin = MODES.summer;
    for (const s of [0, 4, 7]) pluck(ac, master, hz(fin.root - 12 + fin.steps[s]), 59.5, 0.2, 3);
    recorder(ac, master, hz(fin.root), 59.5, 2.4, 0.26);

    const buf = await ac.startRendering();
    // Fade the very end and write a WAV.
    const L = buf.getChannelData(0);
    const R = buf.getChannelData(1);
    const n = buf.length;
    const fade = RATE * 1.5;
    let peak = 0;
    for (let i = 0; i < n; i++) peak = Math.max(peak, Math.abs(L[i]), Math.abs(R[i]));
    const norm = peak > 0 ? 0.89 / peak : 1;
    const bytes = new DataView(new ArrayBuffer(44 + n * 4));
    const str = (o, s) => [...s].forEach((c, i) => bytes.setUint8(o + i, c.charCodeAt(0)));
    str(0, 'RIFF');
    bytes.setUint32(4, 36 + n * 4, true);
    str(8, 'WAVEfmt ');
    bytes.setUint32(16, 16, true);
    bytes.setUint16(20, 1, true);
    bytes.setUint16(22, 2, true);
    bytes.setUint32(24, RATE, true);
    bytes.setUint32(28, RATE * 4, true);
    bytes.setUint16(32, 4, true);
    bytes.setUint16(34, 16, true);
    str(36, 'data');
    bytes.setUint32(40, n * 4, true);
    for (let i = 0; i < n; i++) {
      const f = i > n - fade ? (n - i) / fade : i < RATE * 0.5 ? i / (RATE * 0.5) : 1;
      bytes.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i] * norm * f)) * 32767, true);
      bytes.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i] * norm * f)) * 32767, true);
    }
    let bin = '';
    const u8 = new Uint8Array(bytes.buffer);
    for (let i = 0; i < u8.length; i += 0x8000) bin += String.fromCharCode(...u8.subarray(i, i + 0x8000));
    return btoa(bin);
  }
  window.render = render;
</script>
